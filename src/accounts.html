<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- <title>WhatsApp Electron :: Accounts</title> -->
    <link href="../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
  </head>
  <body>
    <div class="container" style="width: 600px">

      <table class="m-auto mt-3 w-100">
        <tr>
          <td class="text-center w-25">
            <img src="../assets/whatsapp-icon-512x512.png" style="width: 96px">
          </td>
          <td class="align-middle text-center">
            <span><h2>WhatsApp Electron</h2></span>
          </td>
        </tr>
      </table>

      <div class="d-flex justify-content-between m-auto mt-4 border-bottom w-100">
        <div>
          <h5 class="pt-3 fw-bolder">Accounts</h5>
        </div>
        <div>
          <button type="button" class="btn fs-4 acct-add" title="Add Account" data-bs-toggle="modal" data-bs-target="#accountModal" data-bs-action="new"><i class="bi bi-person-fill-add"></i></button>
        </div>
      </div>

      <table class="table m-auto mt-3 text-center w-100">
        <thead>
          <tr>
            <th scope="col">#ID</th>
            <th scope="col">Name/Description</th>
            <th scope="col">Options</th>
          </tr>
        </thead>
        <tbody class="align-middle acct-list">
          <!-- Accounts List -->
        </tbody>
      </table>

    </div>

    <div class="modal fade" id="accountModal" tabindex="-1" aria-labelledby="accountModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header py-2">
            <h1 class="modal-title fs-5" id="accountModalLabel">Account</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="accountForm" novalidate>
              <input type="hidden" id="acct-action" value="">
              <input type="hidden" id="acct-id" value="">
              <div class="mb-3">
                <label for="acct-name" class="col-form-label">Account Name:</label>
                <input type="text" class="form-control" id="acct-name" required>
                <div class="invalid-feedback">Account name is required!</div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary acct-save">OK</button>
          </div>
        </div>
      </div>
    </div>
    
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header py-2">
            <h1 class="modal-title fs-5" id="deleteModalLabel">Remove Account</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p>Do you realy want to remove account <span id="acct-account-remove-name"></span>?</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
            <button type="button" class="btn btn-primary" id="acct-delete-button">Yes</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="screenShareModal" tabindex="-1" aria-labelledby="screenShareModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header py-2">
            <h1 class="modal-title fs-5" id="screenShareModalLabel">Screen Share</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p class="d-inline-flex justify-content-center w-100 mb-0">
              <button type="button" class="btn btn-light border me-2 btn-share-type" data-bs-toggle="button" data-bs-target="#share-screens">Screens</button>
              <button type="button" class="btn btn-light border ms-2 btn-share-type" data-bs-toggle="button" data-bs-target="#share-windows">Windows</button>
            </p>
            <hr>
            <div id="share-screens" class="collapse row mx-auto"></div>
            <div id="share-windows" class="collapse row mx-auto">
              <div class="row w-100">
                <div class="col" id="share-windows-radios"></div>
                <div class="col text-center">
                  <img id="share-windows-thumb" class="border" src="https://raw.githubusercontent.com/dagmoller/whatsapp-electron/main/assets/whatsapp-icon-512x512.png" style="max-width: 300px;">
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="btn-share-cancel">Cancel</button>
            <button type="button" class="btn btn-primary" id="btn-share-ok">Share</button>
          </div>
        </div>
      </div>
    </div>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../node_modules/jquery/dist/jquery.min.js"></script>
    <script src="accounts.js"></script>
  </body>
</html>
